# Isolated feature preview: never points at the baseline database.
spring.datasource.url=${JAVA_TEMPLATE_DB_URL:jdbc:h2:file:./data/java-template/interviews}
spring.sql.init.schema-locations=classpath:schema.sql,classpath:template-schema.sql
interview.invitation-key-file=./data/java-template/invitation-link.key
interview.catalogue-enabled=true
interview.coding-enabled=${INTERVIEW_CODING_ENABLED:false}
interview.coding-image=interview-java-runner:1
spring.jackson.deserialization.accept-float-as-int=false
