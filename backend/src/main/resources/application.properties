server.address=127.0.0.1
server.port=8080
spring.application.name=exl-interview-poc
spring.datasource.url=${INTERVIEW_DB_URL:jdbc:h2:file:./data/interviews}
spring.datasource.username=sa
spring.datasource.password=${INTERVIEW_DB_PASSWORD:}
spring.sql.init.mode=always
interview.invitation-code=${INTERVIEW_INVITATION_CODE:}
interview.reviewer-code=${INTERVIEW_REVIEWER_CODE:}
interview.duration-seconds=${INTERVIEW_DURATION_SECONDS:1800}
interview.evidence-retention-days=${INTERVIEW_EVIDENCE_RETENTION_DAYS:30}
server.error.include-message=always
interview.recruiter-setup-code=${INTERVIEW_RECRUITER_SETUP_CODE:}
logging.level.org.springframework.web=INFO
interview.invitation-key-file=${INTERVIEW_INVITATION_KEY_FILE:./data/invitation-link.key}

# Assessment catalogue is now available in the main application.
spring.sql.init.schema-locations=classpath:schema.sql,classpath:template-schema.sql
interview.catalogue-enabled=${INTERVIEW_CATALOGUE_ENABLED:true}
interview.coding-enabled=${INTERVIEW_CODING_ENABLED:false}
interview.coding-image=interview-java-runner:1
interview.admin-setup-code=${INTERVIEW_ADMIN_SETUP_CODE:}

# Bulk invitations work without email. Enable SMTP only after configuring a mail service.
interview.public-app-url=${INTERVIEW_PUBLIC_APP_URL:http://127.0.0.1:4200}
interview.email-enabled=${INTERVIEW_EMAIL_ENABLED:false}
interview.email-from=${INTERVIEW_EMAIL_FROM:}
interview.smtp-host=${INTERVIEW_SMTP_HOST:}
interview.smtp-port=${INTERVIEW_SMTP_PORT:587}
interview.smtp-username=${INTERVIEW_SMTP_USERNAME:}
interview.smtp-password=${INTERVIEW_SMTP_PASSWORD:}
interview.smtp-starttls=${INTERVIEW_SMTP_STARTTLS:true}

# Local-only optional configuration; backend/.env.local is excluded from Git.
spring.config.import=optional:file:./.env.local[.properties]
interview.ai-enabled=${INTERVIEW_AI_ENABLED:false}
interview.ai-key=${OPENAI_API_KEY:}
interview.ai-model=${INTERVIEW_AI_MODEL:gpt-6.1-sol}

# Subscription connection is restricted to loopback requests, separate from API billing.
interview.chatgpt-enabled=${INTERVIEW_CHATGPT_ENABLED:true}
interview.chatgpt-storage=./data/chatgpt
